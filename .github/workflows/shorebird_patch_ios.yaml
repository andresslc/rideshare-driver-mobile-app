# Ships a Dart-only patch to iOS devices already running a given release.
# This goes live immediately - App Review is not in front of it.
# Manual trigger only, on purpose.
name: Shorebird Patch (iOS)

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Flavor to patch (matches the Xcode scheme)
        type: choice
        options:
          - prod
          - staging
          - dev
        default: staging
      release-version:
        description: Release version to patch (e.g. 2.0.16+26), or 'latest'
        default: latest

concurrency:
  group: shorebird-patch-ios-${{ inputs.flavor }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: macos-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      FLAVOR: ${{ inputs.flavor }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve entrypoint for flavor
        run: |
          case "$FLAVOR" in
            dev)     echo "TARGET=lib/main_dev.dart"     >> "$GITHUB_ENV" ;;
            staging) echo "TARGET=lib/main_staging.dart" >> "$GITHUB_ENV" ;;
            prod)    echo "TARGET=lib/main_prod.dart"    >> "$GITHUB_ENV" ;;
            *) echo "::error::Unknown flavor: $FLAVOR"; exit 1 ;;
          esac

      # A patch runs a real Xcode build, so it needs the same signing setup
      # as the release workflow.
      - name: Install Apple signing assets
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          pip3 install --break-system-packages codemagic-cli-tools
          keychain initialize
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          keychain add-certificates \
            --certificate "$RUNNER_TEMP/cert.p12" \
            --certificate-password "$IOS_CERTIFICATE_PASSWORD"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/build.mobileprovision"

      # Mapbox iOS SDKs are pulled by CocoaPods from api.mapbox.com, which
      # requires HTTP Basic auth via ~/.netrc. Without this, pod install fails
      # with 401 Unauthorized on MapboxNavigationNative.
      - name: Configure Mapbox downloads token
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          printf 'machine api.mapbox.com\n  login mapbox\n  password %s\n' "$MAPBOX_DOWNLOADS_TOKEN" > "$HOME/.netrc"
          chmod 600 "$HOME/.netrc"

      - name: Apply provisioning profile to the Xcode project
        run: |
          mkdir -p build/ios
          xcode-project use-profiles \
            --project ios/Runner.xcodeproj \
            --export-options-plist=build/ios/export_options.plist

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      # Match the release workflow: disable SPM so the patch build path
      # matches the release build path (both use CocoaPods only).
      # Write settings file directly — flutter binary isn't on PATH yet.
      - name: Disable Swift Package Manager on this runner
        run: |
          mkdir -p "$HOME/Library/Application Support/flutter"
          echo '{"enable-swift-package-manager": false}' \
            > "$HOME/Library/Application Support/flutter/.flutter_settings"

      - uses: shorebirdtech/shorebird-patch@v1
        id: patch
        with:
          platform: ios
          release-version: ${{ inputs.release-version }}
          args: --flavor ${{ env.FLAVOR }} -t ${{ env.TARGET }} --export-options-plist=build/ios/export_options.plist

      - name: Summary
        run: |
          {
            echo "### Shorebird iOS patch published"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Flavor | $FLAVOR |"
            echo "| Release | ${{ inputs.release-version }} |"
            echo "| Patch number | ${{ steps.patch.outputs.patch-number }} |"
            echo ""
            echo "This patch is live on devices now. Verify on a real device before patching prod."
          } >> "$GITHUB_STEP_SUMMARY"
