# Ships a Dart-only patch to devices already running a given release.
# This goes live immediately - there is no store review in front of it.
# Manual trigger only, on purpose.
name: Shorebird Patch (Android)

on:
  workflow_dispatch:
    inputs:
      flavor:
        description: Flavor to patch
        type: choice
        options:
          - production
          - staging
          - dev
        default: staging
      release-version:
        description: Release version to patch (e.g. 2.0.16+26), or 'latest'
        default: latest

concurrency:
  group: shorebird-patch-android-${{ inputs.flavor }}
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      FLAVOR: ${{ inputs.flavor }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve entrypoint for flavor
        run: |
          case "$FLAVOR" in
            dev)        echo "TARGET=lib/main_dev.dart"     >> "$GITHUB_ENV" ;;
            staging)    echo "TARGET=lib/main_staging.dart" >> "$GITHUB_ENV" ;;
            production) echo "TARGET=lib/main_prod.dart"    >> "$GITHUB_ENV" ;;
            *) echo "::error::Unknown flavor: $FLAVOR"; exit 1 ;;
          esac

      # A patch runs a real Flutter build, so it needs the same signing and
      # local.properties setup as the release workflow.
      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload-keystore.jks
          storePassword=$ANDROID_STORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Write android/local.properties
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          cat > android/local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          MAPS_API_KEY=$MAPS_API_KEY
          MAPBOX_ACCESS_TOKEN=$MAPBOX_ACCESS_TOKEN
          MAPBOX_DOWNLOADS_TOKEN=$MAPBOX_DOWNLOADS_TOKEN
          EOF

      # Match the release workflow: shrink Gradle memory for this VM.
      - name: Shrink Gradle memory to fit the CI runner
        run: sed -i 's/-Xmx8G -XX:MaxMetaspaceSize=4G/-Xmx4G -XX:MaxMetaspaceSize=1G/' android/gradle.properties

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - uses: shorebirdtech/shorebird-patch@v1
        id: patch
        with:
          platform: android
          release-version: ${{ inputs.release-version }}
          args: --flavor ${{ env.FLAVOR }} -t ${{ env.TARGET }}

      - name: Summary
        run: |
          {
            echo "### Shorebird patch published"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Flavor | $FLAVOR |"
            echo "| Release | ${{ inputs.release-version }} |"
            echo "| Patch number | ${{ steps.patch.outputs.patch-number }} |"
            echo ""
            echo "This patch is live on devices now. Verify on a real device before patching production."
          } >> "$GITHUB_STEP_SUMMARY"
