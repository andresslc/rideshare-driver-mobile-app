# ======================================================
# 📦 Project Information
# ======================================================

name: driver_app
description: "A clean Flutter project template."
publish_to: "none" # Prevents accidental publishing to pub.dev

# App Versioning
# version: MAJOR.MINOR.PATCH+BUILD
version: 3.0.4+42

# ======================================================
# 🧩 Environment Configuration
# ======================================================

environment:
  sdk: ">=3.9.0 <4.0.0" # Compatible with Dart 3.x

# ======================================================
# 📚 Dependencies
# ======================================================

dependencies:
  # ---------------- Flutter SDK ----------------
  flutter:
    sdk: flutter

  # ---------------- UI & Design ----------------
  cupertino_icons: ^1.0.8 # iOS-style icons
  flutter_svg: ^2.2.3 # SVG image support
  gradient_borders: ^1.0.2 # Gradient borders for UI
  gap: ^3.0.1 # Sized spacing widgets
  loading_animation_widget: ^1.3.0 # Prebuilt loaders

  # ---------------- State Management ----------------
  flutter_riverpod: ^3.2.1 # Main state management
  riverpod_annotation: ^4.0.2 # Riverpod code annotations

  # ---------------- Navigation & Routing ----------------
  go_router: ^17.1.0 # Declarative routing
  url_launcher: ^6.3.2

  # ---------------- Networking ----------------
  dio: ^5.9.1 # HTTP client
  flutter_stripe: ^12.2.0 # Stripe payments + Financial Connections

  # ---------------- Functional Programming ----------------
  fpdart: ^1.2.0 # Functional utilities
  # dartz: ^0.10.1 # Either, Option, etc.

  # ---------------- Local Storage ----------------
  shared_preferences: ^2.5.3 # Key-value storage

  # ---------------- Dependency Injection ----------------
  get_it: ^9.2.0 # Service locator

  # ---------------- Formatting & Validation ----------------
  intl: ^0.20.2 # Date & number formatting
  mask_text_input_formatter: ^2.9.0 # Input masking

  # ---------------- Location & Permissions ----------------
  geolocator: ^14.0.2 # GPS & location services
  permission_handler: ^11.3.1 # Runtime permissions

  # ---------------- Firebase ----------------
  firebase_auth: ^6.1.4 # Authentication
  # firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  firebase_remote_config: ^6.1.1

  # ---------------- Media ----------------
  image_picker: ^1.2.1 # Camera & gallery access
  cached_network_image: ^3.4.1 # Image caching

  # ---------------- Localization ----------------
  flutter_localizations:
    sdk: flutter # Multi-language support

  # ---------------- Notifications ----------------
  flutter_local_notifications: ^19.4.0
  device_info_plus: ^12.3.0
  pinput: ^6.0.2
  google_maps_flutter: ^2.3.0
  google_maps_utils: ^2.0.0
  flutter_mapbox_navigation:
    git:
      url: https://github.com/Mohtashim-Naeem/flutter_mapbox_navigation.git
      ref: arrived-fixes

  dotted_border: ^3.1.0
  photo_view: ^0.15.0
  socket_io_client: ^3.1.4
  geocoding: ^2.0.5
  flutter_polyline_points: ^2.1.0
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  animated_segmented_tab_control: ^2.0.0
  flutter_bounceable: ^1.2.0
  connectivity_plus: ^7.1.0
  # device_preview: ^1.3.1
  #  gif_view: ^1.0.3
  slide_to_act: ^2.0.2
  slider_button: ^3.1.0
  #  action_button: ^1.0.0
  lottie: ^3.3.3
  # lottie: ^3.5.1

  package_info_plus: ^9.0.1
  flutter_zoom_drawer: ^3.2.0
  flutter_animate: ^4.5.2
  wakelock_plus: ^1.5.2
  firebase_core: ^4.11.0
  flutter_sound: ^9.30.0

# ======================================================
# 🛠️ Dev Dependencies (Development Only)
# ======================================================

dev_dependencies:
  # ---------------- Testing ----------------
  flutter_test:
    sdk: flutter # Flutter testing framework

  # ---------------- Linting ----------------
  flutter_lints: ^6.0.0 # Code style rules

  # ---------------- Riverpod Generators (Optional) ----------------
  # Uncomment if using code generation

  # riverpod_generator: ^3.0.3
  # build_runner: ^2.4.14
  # custom_lint: ^0.7.5
  # riverpod_lint: ^3.0.2

# ======================================================
# 🎨 Flutter Configuration
# ======================================================

flutter:
  generate: true # Enable localization code generation

  uses-material-design: true # Enable Material Icons

  # ---------------- Custom Fonts ----------------
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf

        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500

        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600

        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

  # ---------------- Assets ----------------
  assets:
    - assets/icons/
    - assets/images/
    - assets/lottie/
    - assets/map_style/dark_map.json
    - assets/map_style/light_map.json
    - assets/sounds/
    - shorebird.yaml
